services:

  postgres:

    image: postgres:14

    container_name: sensor-service-postgres

    environment:
      POSTGRES_DB: sensors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d sensors"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  app:

    build:
      context: .

    container_name: sensor-service-app

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sensors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      SERVER_PORT: 8080

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:

  postgres_data: