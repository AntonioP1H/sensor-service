version: '3.8'

  services:
    postgres:
      image: postgres:14
      container_name: sensor-service-postgres
      environment:
        POSTGRES_DB: sensors
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_HOST_AUTH_METHOD: trust
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    app:
      build: .
      container_name: sensor-service-app
      environment:
        POSTGRES_HOST: postgres
        POSTGRES_PORT: 5432
        POSTGRES_DB: sensors
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        SERVER_PORT: 8080
      ports:
        - "8080:8080"
      depends_on:
        - postgres

  volumes:
    postgres_data: