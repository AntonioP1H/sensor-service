name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: sensors
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: sensors
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      BUILD_TYPE: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libpq-dev \
            libgtest-dev \
            postgresql-client \
            wget \
            libasio-dev

      - name: Build and install GoogleTest & GoogleMock
        run: |
          cd /usr/src/googletest
          sudo mkdir build && cd build
          sudo cmake ..
          sudo make
          sudo make install

      - name: Build and install libpqxx
        run: |
          git clone --depth 1 https://github.com/jtv/libpqxx.git
          cd libpqxx
          mkdir build && cd build
          cmake .. -DBUILD_DOC=OFF -Dpqxx_BUILD_TEST=OFF
          sudo cmake --build . --target install

      - name: Build and install Crow
        run: |
          git clone https://github.com/CrowCpp/Crow.git
          cd Crow
          mkdir build && cd build
          cmake .. -DCROW_BUILD_EXAMPLES=OFF -DCROW_BUILD_TESTS=OFF
          sudo cmake --build . --target install

      - name: Update Shared Library Cache
        run: sudo ldconfig

      - name: Initialize Database Schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sensors -f schema.sql

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} -- -j$(nproc)

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -R UnitTest

      - name: Run integration tests
        run: |
          cd build
          ctest --output-on-failure -R IntegrationTest
